<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PROTOKOL">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d10">
<title>PROTOKOL</title>
<style>
  :root{
    --bg:#0b0d10;
    --card:#14181d;
    --card-2:#1b2028;
    --border:#262c35;
    --text:#e8ecef;
    --muted:#8b95a1;
    --accent:#3b82f6;
    --accent-2:#60a5fa;
    --danger:#ef4444;
    --success:#22c55e;
    --warn:#f59e0b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased; color-scheme:dark;}
  body{padding-bottom: calc(78px + env(safe-area-inset-bottom));}
  h1,h2,h3,p{margin:0;}
  .header{
    position:sticky; top:0; z-index:10;
    background:rgba(11,13,16,0.92); backdrop-filter:blur(10px);
    padding: calc(14px + env(safe-area-inset-top)) 16px 12px 16px;
    border-bottom:1px solid var(--border);
  }
  .header-row{display:flex; align-items:center; justify-content:space-between;}
  .brand{font-size:20px; font-weight:800; letter-spacing:1px; color:#fff;}
  .brand span{color:var(--accent-2);}
  .badge{
    font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px;
    background:var(--card-2); border:1px solid var(--border); color:var(--muted);
    white-space:nowrap;
  }
  .badge.phase1{color:#93c5fd; border-color:#1d3a63;}
  .badge.phase2{color:#fca5a5; border-color:#5b2323;}
  .subrow{margin-top:6px; font-size:12px; color:var(--muted);}
  main{padding:16px; max-width:520px; margin:0 auto;}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:16px; margin-bottom:14px;
  }
  .card-title{font-size:15px; font-weight:700; color:#fff; margin-bottom:4px;}
  .card-sub{font-size:13px; color:var(--muted); margin-bottom:10px;}
  .banner{
    background:linear-gradient(135deg,#1d2b45,#241a3a); border:1px solid #3b4c78;
    border-radius:16px; padding:14px 16px; margin-bottom:14px;
  }
  .banner b{color:#fff;}
  .banner p{font-size:13px; color:#c7d2fe; margin-top:4px; line-height:1.5;}
  .banner.due{background:linear-gradient(135deg,#3a1d1d,#331515); border-color:#7a2f2f;}
  .banner.due p{color:#fecaca;}
  .row-between{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .pill{
    display:inline-block; font-size:11px; font-weight:800; padding:3px 8px;
    border-radius:999px; background:var(--card-2); color:var(--accent-2);
    border:1px solid var(--border); text-transform:uppercase; letter-spacing:.5px;
  }
  .pill.overdue{color:#fecaca; border-color:#5b2323; background:#2a1414;}
  .pill.today{color:#bbf7d0; border-color:#1d4a2c; background:#122019;}
  .pill.future{color:var(--muted);}
  .exercise{
    border-top:1px solid var(--border); padding:14px 0;
  }
  .exercise:first-child{border-top:none; padding-top:4px;}
  .ex-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .ex-name{font-size:15px; font-weight:700; color:#fff;}
  .unit-pill{
    font-size:10px; font-weight:800; color:#111; background:var(--accent-2);
    padding:2px 7px; border-radius:6px; margin-left:6px; vertical-align:middle;
  }
  .ex-prescription{font-size:12.5px; color:var(--accent-2); font-weight:700; margin-top:3px;}
  .ex-prev{font-size:12.5px; color:var(--muted); margin-top:2px;}
  .hint-badge{
    font-size:12px; font-weight:700; color:#fbbf24; background:rgba(245,158,11,0.12);
    border:1px solid rgba(245,158,11,0.35); padding:5px 9px; border-radius:8px;
    margin-top:6px; display:inline-block;
  }
  .quote-banner{
    font-size:13.5px; font-style:italic; color:var(--accent-2); text-align:center;
    padding:2px 8px 14px 8px; line-height:1.5;
  }
  .yt-link{
    display:inline-flex; align-items:center; gap:4px; font-size:12px; font-weight:700;
    color:#fca5a5; text-decoration:none; border:1px solid #4b2323; background:#221313;
    padding:6px 10px; border-radius:10px; white-space:nowrap;
  }
  .ex-input-row{display:flex; align-items:center; gap:10px; margin-top:10px;}
  input[type=number], input[type=text], input[type=date]{
    background:var(--card-2); border:1px solid var(--border); color:var(--text);
    border-radius:12px; padding:12px 14px; font-size:16px; width:100%;
    -moz-appearance:textfield; -webkit-appearance:none; appearance:none;
    text-align:left; box-sizing:border-box;
  }
  input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; }
  input[type=date]::-webkit-date-and-time-value{ text-align:left; margin:0; }
  input[type=date]::-webkit-calendar-picker-indicator{ filter:invert(0.8); }
  .ex-diff{font-size:12.5px; font-weight:700; min-width:64px; text-align:right;}
  .ex-diff.pos{color:var(--success);}
  .ex-diff.neg{color:var(--danger);}
  .ex-diff.zero{color:var(--muted);}
  button{
    font-family:inherit; cursor:pointer; border:none; border-radius:12px;
    font-weight:700; font-size:15px;
  }
  .btn-primary{
    width:100%; background:var(--accent); color:#fff; padding:16px;
    min-height:52px; font-size:16px; margin-top:6px;
  }
  .btn-primary:active{background:#2f68d1;}
  .btn-secondary{
    background:var(--card-2); color:var(--text); border:1px solid var(--border);
    padding:12px; min-height:48px;
  }
  .btn-danger{
    background:#2a1414; color:#fca5a5; border:1px solid #5b2323; padding:14px;
    min-height:48px; width:100%;
  }
  .counter-row{display:flex; align-items:center; justify-content:center; gap:18px; margin:14px 0;}
  .counter-btn{
    width:56px; height:56px; border-radius:16px; background:var(--card-2);
    border:1px solid var(--border); color:#fff; font-size:26px; font-weight:800;
  }
  .counter-btn:active{background:#232a34;}
  .counter-value{font-size:34px; font-weight:800; color:#fff; min-width:110px; text-align:center;}
  .counter-value small{display:block; font-size:12px; font-weight:600; color:var(--muted); margin-top:2px;}
  .progress-track{
    height:12px; border-radius:999px; background:var(--card-2); border:1px solid var(--border);
    overflow:hidden;
  }
  .progress-fill{height:100%; background:linear-gradient(90deg,var(--accent),var(--accent-2)); border-radius:999px; transition:width .25s ease;}
  .progress-fill.water{background:linear-gradient(90deg,#0891b2,#22d3ee);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:12px 0;}
  .qbtn{background:var(--card-2); border:1px solid var(--border); color:#fff; padding:14px 4px; border-radius:12px; font-size:15px;}
  .qbtn:active{background:#232a34;}
  .qbtn.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px; font-weight:600;}
  .hist-item{border-top:1px solid var(--border); padding:12px 0;}
  .hist-item:first-child{border-top:none;}
  .hist-date{font-size:13px; color:var(--muted); font-weight:700;}
  .hist-day{font-size:15px; font-weight:800; color:#fff; margin-top:2px;}
  .hist-ex{font-size:13px; color:var(--muted); margin-top:6px; line-height:1.6;}
  .hist-ex b{color:var(--text); font-weight:600;}
  .empty{color:var(--muted); font-size:14px; text-align:center; padding:26px 0;}
  .tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    display:flex; background:rgba(20,24,29,0.96); backdrop-filter:blur(10px);
    border-top:1px solid var(--border);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom)) 6px;
  }
  .tab-btn{
    flex:1; background:transparent; color:var(--muted); padding:8px 2px;
    display:flex; flex-direction:column; align-items:center; gap:3px; font-size:11px;
    font-weight:700; border-radius:12px;
  }
  .tab-btn .ic{font-size:20px; display:inline-flex;}
  .tab-btn .ic svg{display:block;}
  .tab-btn.active{color:var(--accent-2); background:rgba(59,130,246,0.12);}
  .small-muted{font-size:12px; color:var(--muted);}
  .divider{height:1px; background:var(--border); margin:14px 0;}
  .daytabs{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px;}
  .daytab-btn{
    background:var(--card-2); border:1px solid var(--border); border-radius:12px;
    padding:10px 4px; display:flex; flex-direction:column; align-items:center; gap:2px;
    color:var(--text);
  }
  .daytab-btn:active{background:#232a34;}
  .daytab-btn.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .daytab-label{font-size:13px; font-weight:800;}
  .daytab-date{font-size:11px; color:var(--muted);}
  .daytab-btn.active .daytab-date{color:#dbeafe;}
  .preview-note{
    font-size:12.5px; color:var(--muted); background:var(--card-2); border:1px solid var(--border);
    border-radius:10px; padding:10px 12px; margin-top:6px; line-height:1.5;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <div class="brand">PROTO<span>KOL</span></div>
    <div id="phaseBadge" class="badge">-</div>
  </div>
  <div class="subrow" id="headerSub">-</div>
</div>

<main id="main"></main>

<nav class="tabbar">
  <button class="tab-btn" data-tab="today" onclick="setTab('today')"><span class="ic"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg></span>Bugün</button>
  <button class="tab-btn" data-tab="water" onclick="setTab('water')"><span class="ic"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg></span>Su</button>
  <button class="tab-btn" data-tab="protein" onclick="setTab('protein')"><span class="ic"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"></path></svg></span>Protein</button>
  <button class="tab-btn" data-tab="history" onclick="setTab('history')"><span class="ic"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg></span>Geçmiş</button>
  <button class="tab-btn" data-tab="settings" onclick="setTab('settings')"><span class="ic"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></span>Ayarlar</button>
</nav>

<script>
"use strict";

/* ---------- Sabitler ---------- */

var STORAGE_KEY = 'protokol_state';

var DAY_INFO = {
  A: { title: 'Sırt / Duruş',        gapToNext: 2, next: 'B' },
  B: { title: 'Göğüs / Omuz',        gapToNext: 2, next: 'C' },
  C: { title: 'Sırt / Omuz Sağlığı', gapToNext: 2, next: 'D' },
  D: { title: 'Bacak / Kol / Core',  gapToNext: 1, next: 'A' }
};

var EXERCISES = {
  A: [
    { id:'a_deadlift',   name:'Barbell Deadlift',                 nameEn:'barbell deadlift',            unit:'kg',     prescription:{ sets:4, target:'6-10 tekrar' } },
    { id:'a_latpull',    name:'Lat Pulldown (Geniş Tutuş)',        nameEn:'wide grip lat pulldown',      unit:'kg',     prescription:{ sets:3, target:'12-15 tekrar' } },
    { id:'a_cablerow',   name:'Seated Cable Row',                  nameEn:'seated cable row',            unit:'kg',     prescription:{ sets:3, target:'12-15 tekrar' } },
    { id:'a_facepull',   name:'Face Pull',                         nameEn:'face pull cable exercise',    unit:'kg',     prescription:{ sets:3, target:'12-15 tekrar' } },
    { id:'a_dbrow',      name:'Tek Kol Dumbbell Row',              nameEn:'single arm dumbbell row',     unit:'kg_arm', prescription:{ sets:3, target:'12-15 tekrar' } },
    { id:'a_traprise',   name:'Prone Trap Raise (Duruş)',          nameEn:'prone trap raise',            unit:'kg',     prescription:{ sets:3, target:'15 tekrar' } },
    { id:'a_deadhang',   name:'Dead Hang (Duruş)',                 nameEn:'dead hang exercise',          unit:'dk',     prescription:{ sets:3, target:'maks. asılı kal (hedef 20-30 sn)' } }
  ],
  B: [
    { id:'b_dbbench',    name:'Dumbbell Bench Press',              nameEn:'dumbbell bench press',        unit:'kg',     prescription:{ sets:4, target:'6-10 tekrar' } },
    { id:'b_incline',    name:'Incline Dumbbell Press',            nameEn:'incline dumbbell press',      unit:'kg',     prescription:{ sets:4, target:'6-10 tekrar' } },
    { id:'b_flye',       name:'Cable Chest Fly',                   nameEn:'cable chest fly',             unit:'kg',     prescription:{ sets:3, target:'12-15 tekrar' } },
    { id:'b_shoulder',   name:'Seated Dumbbell Shoulder Press',    nameEn:'seated dumbbell shoulder press', unit:'kg',  prescription:{ sets:3, target:'12-15 tekrar' } },
    { id:'b_lateral',    name:'Lateral Raise',                     nameEn:'dumbbell lateral raise',      unit:'kg',     prescription:{ sets:3, target:'12-15 tekrar' } },
    { id:'b_dip',        name:'Ağırlıklı Dips',                    nameEn:'weighted dips chest',         unit:'kg',     prescription:{ sets:4, target:'6-10 tekrar' } }
  ],
  C: [
    { id:'c_pullup',     name:'Ağırlıklı Pull-Up',                 nameEn:'weighted pull up',            unit:'kg',     prescription:{ sets:4, target:'6-10 tekrar' } },
    { id:'c_csrow',      name:'Chest-Supported Dumbbell Row',      nameEn:'chest supported dumbbell row', unit:'kg',    prescription:{ sets:3, target:'12-15 tekrar' } },
    { id:'c_cablerevfly',name:'Cable Reverse Fly',                 nameEn:'cable reverse fly rear delt', unit:'kg',     prescription:{ sets:3, target:'12-15 tekrar' } },
    { id:'c_cableyraise',name:'Cable Y-Raise (Alt Makara, Omuz Sağlığı)', nameEn:'cable y raise shoulder', unit:'kg',   prescription:{ sets:3, target:'12-15 tekrar' } },
    { id:'c_extrot',     name:'Cable External Rotation (Omuz Sağlığı)', nameEn:'cable external rotation shoulder', unit:'kg_arm', prescription:{ sets:3, target:'12-15 tekrar' } },
    { id:'c_farmers',    name:"Farmer's Carry (Duruş/Core)",       nameEn:'farmers carry exercise',      unit:'dk',     prescription:{ sets:3, target:'40m ya da 45-60 sn' } }
  ],
  D: [
    { id:'d_goblet',     name:'Dumbbell Goblet Squat',             nameEn:'dumbbell goblet squat',       unit:'kg',     prescription:{ sets:4, target:'6-10 tekrar' } },
    { id:'d_rdl',        name:'Romanian Deadlift',                 nameEn:'romanian deadlift',           unit:'kg',     prescription:{ sets:4, target:'6-10 tekrar' } },
    { id:'d_bulgarian',  name:'Dumbbell Bulgarian Split Squat',    nameEn:'dumbbell bulgarian split squat', unit:'kg_leg', prescription:{ sets:4, target:'6-10 tekrar/bacak' } },
    { id:'d_lunge',      name:'Walking Lunge',                     nameEn:'walking lunge dumbbell',      unit:'kg_leg', prescription:{ sets:3, target:'12-15 tekrar/bacak' } },
    { id:'d_curl',       name:'Barbell Curl',                      nameEn:'barbell curl',                unit:'kg',     prescription:{ sets:4, target:'6-10 tekrar' } },
    { id:'d_pushdown',   name:'Triceps Pushdown',                  nameEn:'triceps pushdown cable',      unit:'kg',     prescription:{ sets:3, target:'12-15 tekrar' } },
    { id:'d_plank',      name:'Plank (Core)',                      nameEn:'plank exercise',              unit:'dk',     prescription:{ sets:3, target:'45-60 sn' } }
  ]
};

var QUICK_PROTEIN = [10, 20, 30, 50];

var BLOCK_LENGTH_DAYS = 168;
var TOTAL_SESSIONS = 96;
var DEFAULT_BLOCK_START = '2026-08-29';

var MOTIVATION_QUOTES = [
  'Bugün attığın her adım, aynadaki o hedefe bir gün daha yaklaştırıyor.',
  'Duruşun karakterini yansıtır — omuzlarını geriye, göğsünü öne çıkar.',
  'Kaptan Amerika bir günde olmadı, sen de olmayacaksın — ama her antrenman seni oraya taşıyor.',
  'Malta’nın güneşinde o formda yürümek istiyorsan, bugünkü set senin.',
  'Disiplin, motivasyonun bittiği yerde başlar.',
  '6 ay kısa gibi görünür ama her hafta kalıcı bir iz bırakır.',
  'Sabır, ağırlıktan daha güçlü bir kastır — bugün de kullan.',
  'İspanya sahillerinde çekilecek o fotoğrafı bugün inşa ediyorsun.',
  'Güç bir anda gelmez, tutarlılıkla birikir.',
  'Bugün kaçırdığın bir set değil, yarın bulacağın bir bahane.',
  'Omuzların dik, nefesin derin, hedefin net — hazırsın.',
  'Küçük bir ilerleme bile ilerlemedir — bugün onu yakala.',
  'Aynadaki adamı bugünkü seçimlerin şekillendiriyor.',
  'Zor günler, en kalıcı sonuçları bırakan günlerdir.',
  'Bir set daha — sadece bir tane, o bile fark yaratır.',
  'Vücudun her hareketi hatırlar, disiplinin her günü sayar.',
  'Kaptan Amerika’nın sırrı yetenek değil, asla bırakmamaktı.',
  'Bugün rahat olanı değil, doğru olanı seç.',
  'Duruşunu düzelt, günün geri kalanı da seni takip eder.',
  'Malta’ya, İspanya’ya giden yol bugünkü antrenmandan geçiyor.',
  'Sen burada olmak için çok şey feda ettin — bugün de vazgeçme.',
  'Güçlü bir sırt, güçlü bir duruşun temelidir.',
  '6 aylık blok bitmeden önce, bugünün hesabını ver.',
  'En iyi versiyonun, bugün attığın adımların toplamı.',
  'Yorgunluk geçici, bıraktığın alışkanlık kalıcı.',
  'Bir gün kaçsa da program kaymaz — sen de kaçma, devam et.',
  'Bugünkü ter, yarınki güvenin temeli.',
  'Hayalindeki tatil fotoğrafı, bugünkü tekrarlarla netleşiyor.',
  'Disiplin özgürlüktür — bugün bir set daha özgürsün.',
  'Vücudun seni hiç yalan söylemeyen tek aynadır.',
  'Bugün zor, altı ay sonra değerli.',
  'Sadece kaslarını değil, karakterini de inşa ediyorsun.'
];

function motivationIndexForToday(){
  var d = parseISO(todayISO());
  var dayNumber = Math.floor(d.getTime() / 86400000);
  return ((dayNumber % MOTIVATION_QUOTES.length) + MOTIVATION_QUOTES.length) % MOTIVATION_QUOTES.length;
}

function todaysMotivationQuote(){
  return MOTIVATION_QUOTES[motivationIndexForToday()];
}

function defaultState(){
  var t = todayISO();
  return {
    profile: {
      weightKg: 90.5,
      heightCm: 191,
      bodyFatPct: 21.4,
      bodyAge: 36,
      proteinPerKg: 2.2,
      waterGoalBottles: 5
    },
    blockStart: DEFAULT_BLOCK_START,
    blockEnd: addDays(DEFAULT_BLOCK_START, BLOCK_LENGTH_DAYS),
    sessions: [],
    measurements: [],
    dailyLogs: {},
    water: { date: t, bottles: 0 },
    protein: { date: t, grams: 0, history: [] }
  };
}

/* ---------- Tarih yardımcıları ---------- */

function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function toISO(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function parseISO(s){ var p = s.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(iso, n){ var d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); }
function todayISO(){ return toISO(new Date()); }
function daysBetween(fromISO, toISOStr){ return Math.round((parseISO(toISOStr) - parseISO(fromISO)) / 86400000); }
function formatDateTR(iso){
  var d = parseISO(iso);
  var days = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
  var months = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
  return days[d.getDay()] + ', ' + d.getDate() + ' ' + months[d.getMonth()];
}
function formatDateShort(iso){
  var d = parseISO(iso);
  var months = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
  return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}
function formatDateShortNoYear(iso){
  var d = parseISO(iso);
  var months = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
  return d.getDate() + ' ' + months[d.getMonth()];
}

/* ---------- Durum (state) ---------- */

var state = null;

function loadState(){
  var raw = localStorage.getItem(STORAGE_KEY);
  var def = defaultState();
  if (!raw){ return def; }
  try{
    var parsed = JSON.parse(raw);
    return {
      profile: Object.assign({}, def.profile, parsed.profile || {}),
      blockStart: parsed.blockStart || def.blockStart,
      blockEnd: parsed.blockEnd || def.blockEnd,
      sessions: Array.isArray(parsed.sessions) ? parsed.sessions : [],
      measurements: Array.isArray(parsed.measurements) ? parsed.measurements : [],
      dailyLogs: (parsed.dailyLogs && typeof parsed.dailyLogs === 'object') ? parsed.dailyLogs : {},
      water: parsed.water || def.water,
      protein: parsed.protein || def.protein
    };
  } catch(e){
    return def;
  }
}

function syncTodayLog(){
  var t = todayISO();
  state.dailyLogs[t] = state.dailyLogs[t] || {};
  state.dailyLogs[t].waterBottles = state.water.bottles;
  state.dailyLogs[t].proteinGrams = state.protein.grams;
}

function saveState(){
  syncTodayLog();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function normalizeDaily(){
  var t = todayISO();
  var changed = false;
  if (state.water.date !== t){
    var oldWaterDate = state.water.date;
    state.dailyLogs[oldWaterDate] = state.dailyLogs[oldWaterDate] || {};
    state.dailyLogs[oldWaterDate].waterBottles = state.water.bottles;
    state.water = { date: t, bottles: 0 };
    changed = true;
  }
  if (state.protein.date !== t){
    var oldProteinDate = state.protein.date;
    state.dailyLogs[oldProteinDate] = state.dailyLogs[oldProteinDate] || {};
    state.dailyLogs[oldProteinDate].proteinGrams = state.protein.grams;
    state.protein = { date: t, grams: 0, history: [] };
    changed = true;
  }
  if (changed) saveState();
}

/* ---------- İş mantığı: kayan takvim ---------- */

function getNextSession(){
  var sessions = state.sessions;
  if (sessions.length === 0){
    return { dayType: 'A', dueDate: state.blockStart };
  }
  var last = sessions[sessions.length - 1];
  var info = DAY_INFO[last.dayType];
  return { dayType: info.next, dueDate: addDays(last.date, info.gapToNext) };
}

function getNextDateForDayType(dayType){
  var cur = getNextSession();
  while (cur.dayType !== dayType){
    var info = DAY_INFO[cur.dayType];
    cur = { dayType: info.next, dueDate: addDays(cur.dueDate, info.gapToNext) };
  }
  return cur.dueDate;
}

function getCompletedCount(){ return state.sessions.length; }
function getCurrentWeek(){ return Math.floor(getCompletedCount() / 4) + 1; }
function getSessionsThisWeek(){ return getCompletedCount() % 4; }
function getPhase(){ return getCurrentWeek() <= 12 ? 1 : 2; }
function isPhaseCheckWeek(){ return getCurrentWeek() === 12; }

function getPrevSessionForDay(dayType){
  for (var i = state.sessions.length - 1; i >= 0; i--){
    if (state.sessions[i].dayType === dayType) return state.sessions[i];
  }
  return null;
}

function getLastNValuesForExercise(dayType, exId, n){
  var vals = [];
  for (var i = state.sessions.length - 1; i >= 0 && vals.length < n; i--){
    var s = state.sessions[i];
    if (s.dayType === dayType && s.exercises && s.exercises[exId]){
      vals.unshift(s.exercises[exId].value);
    }
  }
  return vals;
}

function shouldShowProgressionHint(dayType, exId){
  var lastTwo = getLastNValuesForExercise(dayType, exId, 2);
  return lastTwo.length === 2 && lastTwo[1] >= lastTwo[0];
}

function setBlockStart(newVal){
  if (state.sessions.length > 0) return;
  if (!newVal){ render(); return; }
  var minDate = addDays(todayISO(), -3);
  var maxDate = addDays(todayISO(), 90);
  // iOS Safari'nin tarih tekerleği (wheel picker) gün/ay/yıl tek tek
  // çevrilirken ara adımlarda geçici olarak aralık dışı bir değer üretebilir.
  // Bunu hata olarak göstermek yerine sessizce en yakın geçerli tarihe
  // yuvarlıyoruz; kullanıcı hiçbir uyarı görmez.
  var clamped = newVal;
  if (clamped < minDate) clamped = minDate;
  else if (clamped > maxDate) clamped = maxDate;
  state.blockStart = clamped;
  state.blockEnd = addDays(clamped, BLOCK_LENGTH_DAYS);
  saveState();
  render();
}

function undoLastSession(){
  if (state.sessions.length === 0) return;
  var last = state.sessions[state.sessions.length - 1];
  if (!confirm('Son tamamlanan seansı (Gün ' + last.dayType + ' · ' + formatDateTR(last.date) + ') geri almak istiyor musun?')) return;
  state.sessions.pop();
  selectedDayPreview = null;
  saveState();
  render();
}

function unitLabel(u){
  if (u === 'kg') return 'kg';
  if (u === 'kg_arm') return 'kg/kol';
  if (u === 'kg_leg') return 'kg/bacak';
  if (u === 'dk') return 'dk';
  return '';
}

function ytLink(nameEn){
  return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(nameEn + ' exercise tutorial');
}

function proteinTarget(){
  return Math.round(state.profile.weightKg * state.profile.proteinPerKg);
}

/* ---------- Vücut ölçüm geçmişi ---------- */

function sortedMeasurements(){
  return state.measurements.slice().sort(function(a, b){
    return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0);
  });
}

function getLastTwoMeasurementsDiff(){
  var sorted = sortedMeasurements();
  if (sorted.length < 2) return null;
  var last = sorted[sorted.length - 1];
  var prev = sorted[sorted.length - 2];
  var weightDiff = Math.round((last.weightKg - prev.weightKg) * 10) / 10;
  var fatDiff = (last.bodyFatPct != null && prev.bodyFatPct != null)
    ? Math.round((last.bodyFatPct - prev.bodyFatPct) * 10) / 10
    : null;
  return { weightDiff: weightDiff, fatDiff: fatDiff };
}

function saveMeasurement(){
  var weight = parseFloat(document.getElementById('meas_weight').value);
  var bodyfat = parseFloat(document.getElementById('meas_bodyfat').value);
  var bodyage = parseFloat(document.getElementById('meas_bodyage').value);

  if (isNaN(weight) || weight <= 0){
    alert('Geçerli bir kilo girmelisin.');
    return;
  }

  state.profile.weightKg = weight;
  if (!isNaN(bodyfat) && bodyfat >= 0) state.profile.bodyFatPct = bodyfat;
  if (!isNaN(bodyage) && bodyage > 0) state.profile.bodyAge = bodyage;

  state.measurements.push({
    date: todayISO(),
    weightKg: weight,
    bodyFatPct: isNaN(bodyfat) ? null : bodyfat,
    bodyAge: isNaN(bodyage) ? null : bodyage
  });

  saveState();
  render();
}

/* ---------- Sekme yönetimi ---------- */

var activeTab = 'today';
var selectedDayPreview = null;
function setTab(t){
  activeTab = t;
  selectedDayPreview = null;
  render();
  window.scrollTo(0,0);
}

function selectDayTab(dayType){
  selectedDayPreview = dayType;
  render();
}

/* ---------- Render ---------- */

function render(){
  renderHeader();
  var main = document.getElementById('main');
  if (activeTab === 'today') main.innerHTML = renderToday();
  else if (activeTab === 'water') main.innerHTML = renderWater();
  else if (activeTab === 'protein') main.innerHTML = renderProtein();
  else if (activeTab === 'history') main.innerHTML = renderHistory();
  else if (activeTab === 'settings') main.innerHTML = renderSettings();

  var btns = document.querySelectorAll('.tab-btn');
  btns.forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-tab') === activeTab);
  });

  attachExerciseInputListeners();
}

function renderHeader(){
  var phase = getPhase();
  var badge = document.getElementById('phaseBadge');
  badge.textContent = 'Faz ' + phase + ' · Hafta ' + getCurrentWeek() + '/24';
  badge.className = 'badge ' + (phase === 1 ? 'phase1' : 'phase2');

  var today = todayISO();
  var blockDaysLeft = daysBetween(today, state.blockEnd);
  var remaining = Math.max(0, TOTAL_SESSIONS - getCompletedCount());
  var targetText = blockDaysLeft >= 0
    ? ('Hedef: ' + formatDateShort(state.blockEnd))
    : '6 aylık blok tamamlandı';
  var sub = document.getElementById('headerSub');
  sub.textContent = formatDateTR(today) + ' · ' + targetText + ' · ' + TOTAL_SESSIONS + ' seanstan ' + remaining + "'si kaldı";
}

function renderBlockStartCard(){
  var locked = state.sessions.length > 0;
  if (locked){
    return '<div class="card">' +
      '<div class="card-title">Program Başlangıcı</div>' +
      '<div class="card-sub" style="margin-bottom:0;">Program başlangıcı: ' + formatDateTR(state.blockStart) + ' (kilitli — kayan takvim artık son tamamlanan seansa göre ilerliyor)</div>' +
    '</div>';
  }
  var minDate = addDays(todayISO(), -3);
  var maxDate = addDays(todayISO(), 90);
  // Kullanıcı henüz kendi seçimini yapmadıysa (blockStart hâlâ sabit
  // varsayılan), input'un value'sunu HER ZAMAN bugünün tarihinden hesapla —
  // aksi halde native takvim, eski sabit varsayılanın ayında (ör. Ağustos)
  // açılır, bugünün ayında değil. Kullanıcı bir seçim yaptıysa (chip ya da
  // takvim ile) o gerçek seçimi göster; yine de aralık dışına düşmüşse
  // (zaman ilerlediyse) güvenlik amacıyla sıkıştır.
  var untouched = (state.blockStart === DEFAULT_BLOCK_START);
  var displayValue = untouched ? todayISO() : state.blockStart;
  if (displayValue < minDate) displayValue = minDate;
  else if (displayValue > maxDate) displayValue = maxDate;

  return '<div class="card">' +
    '<div class="card-title">Program Başlangıç Tarihi</div>' +
    '<div class="card-sub">Gün A bu tarihte planlanacak. İlk seansı tamamladıktan sonra bu alan kilitlenir.</div>' +
    '<input type="date" id="blockStartInput" value="' + displayValue + '" min="' + minDate + '" max="' + maxDate + '" onchange="setBlockStart(this.value)">' +
  '</div>';
}

function renderToday(){
  var next = getNextSession();
  var today = todayISO();
  var displayDayType = selectedDayPreview || next.dayType;
  var isActualNext = (displayDayType === next.dayType);
  var info = DAY_INFO[displayDayType];
  var delta = daysBetween(next.dueDate, today);

  var statusHtml;
  if (delta < 0){
    statusHtml = '<span class="pill future">' + Math.abs(delta) + ' gün sonra planlandı</span>';
  } else if (delta === 0){
    statusHtml = '<span class="pill today">Bugün planlandı</span>';
  } else {
    statusHtml = '<span class="pill overdue">' + delta + ' gün gecikti</span>';
  }

  var html = '';

  html += '<div class="quote-banner">“' + todaysMotivationQuote() + '”</div>';

  html += '<div class="daytabs">' +
    ['A','B','C','D'].map(function(dt){
      var dtDate = (dt === next.dayType) ? next.dueDate : getNextDateForDayType(dt);
      var active = (dt === displayDayType);
      return '<button class="daytab-btn' + (active ? ' active' : '') + '" onclick="selectDayTab(\'' + dt + '\')">' +
        '<span class="daytab-label">Gün ' + dt + '</span>' +
        '<span class="daytab-date">' + formatDateShortNoYear(dtDate) + '</span>' +
      '</button>';
    }).join('') +
  '</div>';

  if (state.sessions.length === 0){
    html += renderBlockStartCard();
  }

  if (isPhaseCheckWeek()){
    var measDiff = getLastTwoMeasurementsDiff();
    var measDiffText = '';
    if (measDiff){
      measDiffText = ' Son ölçümden bu yana: ' + (measDiff.weightDiff > 0 ? '+' : '') + measDiff.weightDiff + 'kg' +
        (measDiff.fatDiff != null ? (', ' + (measDiff.fatDiff > 0 ? '+' : '') + measDiff.fatDiff + '% yağ') : '') + '.';
    }
    html += '<div class="banner">' +
      '<b>🔔 Hafta 12 · Faz Geçiş Kontrolü</b>' +
      '<p>Recomp fazının sonuna yaklaştın. Vücut yağı, kilo ve fotoğraflarını güncelle. ' +
      '13. haftadan itibaren otomatik olarak <b>Faz 2 – Lean Bulk</b> stratejisine geçilecek.' + measDiffText + '</p>' +
      '</div>';
  }

  if (delta > 0){
    html += '<div class="banner due">' +
      '<b>⏳ Program kaymış durumda</b>' +
      '<p>Son seanstan bu yana planlanandan ' + delta + ' gün geriden geliyorsun. Sıradaki tüm seanslar buna göre otomatik kaydı.</p>' +
      '</div>';
  }

  html += '<div class="card">';
  html += '<div class="row-between"><h2 class="card-title" style="font-size:19px;">Gün ' + displayDayType + ' · ' + info.title + '</h2></div>';
  if (isActualNext){
    html += '<div class="card-sub">' + statusHtml + ' <span class="small-muted">· planlanan tarih: ' + formatDateTR(next.dueDate) + '</span></div>';
  } else {
    html += '<div class="card-sub"><span class="small-muted">Önizleme · planlanan tarih: ' + formatDateTR(getNextDateForDayType(displayDayType)) + '</span></div>';
  }

  var exList = EXERCISES[displayDayType];
  var prevSession = getPrevSessionForDay(displayDayType);
  exList.forEach(function(ex){
    var prevVal = null;
    if (prevSession && prevSession.exercises && prevSession.exercises[ex.id]){
      prevVal = prevSession.exercises[ex.id].value;
    }
    var hintHtml = '';
    if (shouldShowProgressionHint(displayDayType, ex.id)){
      var hintText = ex.unit === 'dk'
        ? '💡 İlerleme zamanı — bu sefer biraz daha uzun süre dene'
        : '💡 İlerleme zamanı — bu sefer biraz daha ağırlık dene';
      hintHtml = '<div class="hint-badge">' + hintText + '</div>';
    }
    html += '<div class="exercise">' +
      '<div class="ex-top">' +
        '<div><span class="ex-name">' + ex.name + '</span><span class="unit-pill">' + unitLabel(ex.unit) + '</span>' +
        '<div class="ex-prescription">' + ex.prescription.sets + ' set × ' + ex.prescription.target + '</div>' +
        '<div class="ex-prev">' + (prevVal !== null ? 'Önceki: ' + prevVal + ' ' + unitLabel(ex.unit) : 'Önceki kayıt yok') + '</div>' +
        hintHtml +
        '</div>' +
        '<a class="yt-link" href="' + ytLink(ex.nameEn) + '" target="_blank" rel="noopener">▶ YouTube</a>' +
      '</div>' +
      '<div class="ex-input-row">' +
        '<input type="number" inputmode="decimal" step="0.5" min="0" placeholder="' + unitLabel(ex.unit) + '" ' +
          'id="ex_input_' + ex.id + '" data-exid="' + ex.id + '" data-prev="' + (prevVal !== null ? prevVal : '') + '">' +
        '<span class="ex-diff zero" id="ex_diff_' + ex.id + '">' + (prevVal !== null ? '±0' : '') + '</span>' +
      '</div>' +
    '</div>';
  });

  if (isActualNext){
    html += '<button class="btn-primary" onclick="completeSession(\'' + displayDayType + '\')">Seansı Tamamla ✓</button>';
  } else {
    html += '<div class="preview-note">Bu senin sıradaki antrenman günün değil — önizleme modundasın. Sıradaki: Gün ' +
      next.dayType + ', ' + formatDateTR(next.dueDate) + '.</div>';
  }
  html += '</div>';

  if (state.sessions.length > 0){
    var lastSession = state.sessions[state.sessions.length - 1];
    html += '<button class="btn-secondary" style="width:100%; margin-bottom:14px;" onclick="undoLastSession()">↩ Son Seansı Geri Al (Gün ' +
      lastSession.dayType + ' · ' + formatDateTR(lastSession.date) + ')</button>';
  }

  html += '<div class="card">' +
    '<div class="card-title">İlerleme</div>' +
    '<div class="card-sub">Tamamlanan seans: ' + getCompletedCount() + ' · Şu anki hafta: ' + getCurrentWeek() + '/24</div>' +
    '<div class="progress-track"><div class="progress-fill" style="width:' + Math.min(100, Math.round(getCompletedCount()/TOTAL_SESSIONS*100)) + '%"></div></div>' +
    '<div class="card-sub" style="margin-top:8px; margin-bottom:0;">Bu hafta: ' + getSessionsThisWeek() + '/4 seans</div>' +
  '</div>';

  return html;
}

function attachExerciseInputListeners(){
  document.querySelectorAll('.ex-input-row input[type=number]').forEach(function(inp){
    inp.addEventListener('input', function(){
      var exid = inp.getAttribute('data-exid');
      var prevRaw = inp.getAttribute('data-prev');
      var diffEl = document.getElementById('ex_diff_' + exid);
      if (!diffEl) return;
      if (prevRaw === '' || inp.value === ''){
        diffEl.textContent = '';
        return;
      }
      var diff = parseFloat(inp.value) - parseFloat(prevRaw);
      diff = Math.round(diff * 100) / 100;
      if (diff > 0){ diffEl.textContent = '▲ +' + diff; diffEl.className = 'ex-diff pos'; }
      else if (diff < 0){ diffEl.textContent = '▼ ' + diff; diffEl.className = 'ex-diff neg'; }
      else { diffEl.textContent = '± 0'; diffEl.className = 'ex-diff zero'; }
    });
  });
}

function completeSession(dayType){
  if (dayType !== getNextSession().dayType) return;
  var exList = EXERCISES[dayType];
  var exercises = {};
  exList.forEach(function(ex){
    var el = document.getElementById('ex_input_' + ex.id);
    if (el && el.value !== ''){
      exercises[ex.id] = { value: parseFloat(el.value), unit: ex.unit };
    }
  });
  if (Object.keys(exercises).length === 0){
    if (!confirm('Hiç egzersiz girmedin. Yine de seansı boş olarak tamamlamak istiyor musun?')) return;
  }
  state.sessions.push({ date: todayISO(), dayType: dayType, exercises: exercises });
  selectedDayPreview = null;
  saveState();
  render();
}

function renderWater(){
  var w = state.water;
  var goal = state.profile.waterGoalBottles;
  var ml = w.bottles * 700;
  var goalMl = goal * 700;
  var pct = goalMl > 0 ? Math.min(100, Math.round(ml / goalMl * 100)) : 0;

  var html = '<div class="card">' +
    '<div class="card-title">Bugünkü Su Tüketimi</div>' +
    '<div class="card-sub">700ml\'lik şişe bazında takip</div>' +
    '<div class="counter-row">' +
      '<button class="counter-btn" onclick="removeBottle()">–</button>' +
      '<div class="counter-value">' + w.bottles + '<small>şişe (' + ml + ' ml)</small></div>' +
      '<button class="counter-btn" onclick="addBottle()">+</button>' +
    '</div>' +
    '<div class="progress-track"><div class="progress-fill water" style="width:' + pct + '%"></div></div>' +
    '<div class="card-sub" style="margin-top:8px; margin-bottom:0;">Hedef: ' + goal + ' şişe (' + goalMl + ' ml) · %' + pct + '</div>' +
  '</div>';

  html += '<div class="card">' +
    '<div class="card-title">Günlük Hedef</div>' +
    '<div class="field" style="margin-bottom:0;">' +
      '<label>Hedef şişe sayısı (700ml)</label>' +
      '<input type="number" inputmode="numeric" min="1" step="1" value="' + goal + '" onchange="updateWaterGoal(this.value)">' +
    '</div>' +
  '</div>';

  return html;
}

function addBottle(){ state.water.bottles++; saveState(); render(); }
function removeBottle(){ state.water.bottles = Math.max(0, state.water.bottles - 1); saveState(); render(); }
function updateWaterGoal(v){
  var n = parseInt(v, 10);
  if (!isNaN(n) && n > 0){ state.profile.waterGoalBottles = n; saveState(); }
  render();
}

function renderProtein(){
  var p = state.protein;
  var target = proteinTarget();
  var pct = target > 0 ? Math.min(100, Math.round(p.grams / target * 100)) : 0;
  var phase = getPhase();
  var phaseText = phase === 1
    ? 'Faz 1 · Recomp — hafif kalori açığı + yüksek protein (%' + state.profile.bodyFatPct + ' → hedef ~%16-17 vücut yağı)'
    : 'Faz 2 · Lean Bulk — tanımın üzerine kas ekleme, kalori dengeye/hafif fazlaya çekilir';

  var html = '<div class="card">' +
    '<div class="card-title">Bugünkü Protein</div>' +
    '<div class="card-sub">' + phaseText + '</div>' +
    '<div class="counter-row" style="margin:10px 0;">' +
      '<div class="counter-value" style="min-width:180px;">' + p.grams + ' / ' + target + 'g</div>' +
    '</div>' +
    '<div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
    '<div class="card-sub" style="margin-top:8px; margin-bottom:0;">Hedef: vücut ağırlığı × ' + state.profile.proteinPerKg + ' g/kg = ' + target + 'g</div>' +
  '</div>';

  html += '<div class="card">' +
    '<div class="card-title">Hızlı Ekle</div>' +
    '<div class="grid4">' +
      QUICK_PROTEIN.map(function(g){ return '<button class="qbtn" onclick="addProtein(' + g + ')">+' + g + 'g</button>'; }).join('') +
    '</div>' +
    '<div class="ex-input-row">' +
      '<input type="number" inputmode="numeric" min="0" step="1" placeholder="özel miktar (g)" id="proteinCustomInput">' +
      '<button class="btn-secondary" onclick="addProteinCustom()">Ekle</button>' +
    '</div>' +
    '<div class="grid2" style="margin-top:12px;">' +
      '<button class="btn-secondary" onclick="undoProtein()">↩ Geri Al</button>' +
      '<button class="btn-secondary" onclick="resetProtein()">Sıfırla</button>' +
    '</div>' +
  '</div>';

  html += '<div class="card">' +
    '<div class="card-title">Takviye Notu</div>' +
    '<div class="card-sub" style="margin-bottom:0;">Antrenman sonrası whey + günde 3-5g kreatin. ' +
    'Magnezyum ürünlerinden (MAG Premium / Ocean ExtraMag) sadece biri kullanılmalı, ikisi birlikte değil. ' +
    'D3K2 sadece damla veya kapsül formundan biriyle alınmalı. Kolajen, whey\'in yerine değil ek olarak düşünülmeli. ' +
    'Detaylar için PROTOKOL_SPEC.md · Beslenme bölümüne bakın.</div>' +
  '</div>';

  return html;
}

function addProtein(g){
  state.protein.grams += g;
  state.protein.history.push(g);
  saveState();
  render();
}

function addProteinCustom(){
  var el = document.getElementById('proteinCustomInput');
  var v = parseFloat(el.value);
  if (!isNaN(v) && v > 0){ addProtein(v); }
}

function undoProtein(){
  var last = state.protein.history.pop();
  if (last !== undefined){
    state.protein.grams = Math.max(0, state.protein.grams - last);
    saveState();
  }
  render();
}

function resetProtein(){
  if (confirm('Bugünkü protein kaydını sıfırlamak istiyor musun?')){
    state.protein.grams = 0;
    state.protein.history = [];
    saveState();
    render();
  }
}

function renderHistory(){
  var dateSet = {};
  state.sessions.forEach(function(s){ dateSet[s.date] = true; });
  Object.keys(state.dailyLogs).forEach(function(d){ dateSet[d] = true; });

  var dates = Object.keys(dateSet).sort().reverse().filter(function(d){
    var hasSession = state.sessions.some(function(s){ return s.date === d; });
    var log = state.dailyLogs[d];
    var hasLog = !!(log && (log.waterBottles || log.proteinGrams));
    return hasSession || hasLog;
  });

  if (dates.length === 0){
    return '<div class="card"><div class="empty">Henüz kayıt yok.<br>İlk seansını "Bugün" sekmesinden tamamla ya da su/protein ekle.</div></div>';
  }

  var html = '<div class="card"><div class="card-title">Geçmiş</div>';

  if (state.sessions.length > 0){
    var lastSession = state.sessions[state.sessions.length - 1];
    html += '<button class="btn-secondary" style="width:100%; margin-bottom:14px;" onclick="undoLastSession()">↩ Son Seansı Geri Al (Gün ' +
      lastSession.dayType + ' · ' + formatDateTR(lastSession.date) + ')</button>';
  }

  dates.forEach(function(d){
    var sessionsForDate = state.sessions.filter(function(s){ return s.date === d; });
    var log = state.dailyLogs[d];

    html += '<div class="hist-item">' + '<div class="hist-date">' + formatDateTR(d) + '</div>';

    sessionsForDate.forEach(function(s){
      var info = DAY_INFO[s.dayType];
      var exIds = Object.keys(s.exercises || {});
      html += '<div class="hist-day">Gün ' + s.dayType + ' · ' + info.title + '</div>';
      if (exIds.length === 0){
        html += '<div class="hist-ex">Egzersiz kaydı girilmedi</div>';
      } else {
        var exDefs = EXERCISES[s.dayType];
        html += '<div class="hist-ex">';
        exIds.forEach(function(id, i){
          var def = exDefs.filter(function(e){ return e.id === id; })[0];
          var rec = s.exercises[id];
          if (def){
            html += '<b>' + def.name + ':</b> ' + rec.value + ' ' + unitLabel(rec.unit) + (i < exIds.length-1 ? ' &nbsp;·&nbsp; ' : '');
          }
        });
        html += '</div>';
      }
    });

    if (log && (log.waterBottles || log.proteinGrams)){
      var parts = [];
      if (log.waterBottles){ parts.push('💧 ' + log.waterBottles + ' şişe (' + (log.waterBottles * 700) + 'ml)'); }
      if (log.proteinGrams){ parts.push('🍗 ' + log.proteinGrams + 'g protein'); }
      html += '<div class="hist-ex" style="margin-top:' + (sessionsForDate.length ? '8px' : '0') + ';">' + parts.join(' &nbsp;·&nbsp; ') + '</div>';
    }

    html += '</div>';
  });

  html += '</div>';
  return html;
}

function renderMeasurementList(){
  if (state.measurements.length === 0){
    return '<div class="small-muted">Henüz ölçüm kaydı yok.</div>';
  }
  var sorted = sortedMeasurements();
  var last5 = sorted.slice(-5).reverse();
  var html = '';
  last5.forEach(function(m){
    var idx = sorted.indexOf(m);
    var prev = idx > 0 ? sorted[idx - 1] : null;
    var weightDiffText = '';
    var fatDiffText = '';
    if (prev){
      var wd = Math.round((m.weightKg - prev.weightKg) * 10) / 10;
      weightDiffText = ' <span class="small-muted">(' + (wd > 0 ? '▲ +' : (wd < 0 ? '▼ ' : '± ')) + wd + 'kg)</span>';
      if (m.bodyFatPct != null && prev.bodyFatPct != null){
        var fd = Math.round((m.bodyFatPct - prev.bodyFatPct) * 10) / 10;
        fatDiffText = ' <span class="small-muted">(' + (fd > 0 ? '▲ +' : (fd < 0 ? '▼ ' : '± ')) + fd + '%)</span>';
      }
    }
    html += '<div class="hist-item" style="padding:8px 0;">' +
      '<div class="hist-ex" style="margin-top:0;">' + formatDateTR(m.date) + ' — ' + m.weightKg + 'kg' + weightDiffText +
      (m.bodyFatPct != null ? (' · %' + m.bodyFatPct + ' yağ' + fatDiffText) : '') +
      '</div>' +
    '</div>';
  });
  return html;
}

function renderSettings(){
  var pr = state.profile;
  var html = '<div class="card">' +
    '<div class="card-title">Profil</div>' +
    '<div class="card-sub">Ölçüm geçmişine kayıt eklemek için aşağıdaki "Yeni Ölçüm Ekle" bölümünü kullan.</div>' +
    '<div class="field"><label>Vücut Ağırlığı (kg)</label><input type="number" inputmode="decimal" step="0.1" id="set_weight" value="' + pr.weightKg + '"></div>' +
    '<div class="field"><label>Boy (cm)</label><input type="number" inputmode="decimal" step="1" id="set_height" value="' + pr.heightCm + '"></div>' +
    '<div class="field"><label>Vücut Yağı (%)</label><input type="number" inputmode="decimal" step="0.1" id="set_bodyfat" value="' + pr.bodyFatPct + '"></div>' +
    '<div class="field"><label>Vücut Yaşı</label><input type="number" inputmode="numeric" step="1" id="set_bodyage" value="' + pr.bodyAge + '"></div>' +
    '<div class="field"><label>Protein Çarpanı (g/kg)</label><input type="number" inputmode="decimal" step="0.1" id="set_protein_mult" value="' + pr.proteinPerKg + '"></div>' +
    '<div class="field" style="margin-bottom:6px;"><label>Su Hedefi (şişe / 700ml)</label><input type="number" inputmode="numeric" step="1" id="set_water_goal" value="' + pr.waterGoalBottles + '"></div>' +
    '<button class="btn-primary" onclick="saveSettings()">Kaydet</button>' +
  '</div>';

  html += '<div class="card">' +
    '<div class="card-title">Yedekleme</div>' +
    '<div class="card-sub">Verilerin sadece bu telefonda saklanıyor. Telefon değiştirirsen veya Safari verisini silersen kaybolur — düzenli yedek al.</div>' +
    '<div class="grid2">' +
      '<button class="btn-secondary" onclick="downloadBackup()">⬇ Yedeği İndir</button>' +
      '<button class="btn-secondary" onclick="triggerRestoreFilePicker()">⬆ Yedekten Geri Yükle</button>' +
    '</div>' +
    '<input type="file" id="restoreFileInput" accept=".json,application/json" style="display:none;" onchange="restoreBackup(this)">' +
  '</div>';

  html += '<div class="card">' +
    '<div class="card-title">Yeni Ölçüm Ekle</div>' +
    '<div class="card-sub">Güncel ölçümünü gir; hem profilin hem ölçüm geçmişin güncellenir.</div>' +
    '<div class="field"><label>Kilo (kg)</label><input type="number" inputmode="decimal" step="0.1" id="meas_weight" value="' + pr.weightKg + '"></div>' +
    '<div class="field"><label>Vücut Yağı (%)</label><input type="number" inputmode="decimal" step="0.1" id="meas_bodyfat" value="' + pr.bodyFatPct + '"></div>' +
    '<div class="field" style="margin-bottom:6px;"><label>Vücut Yaşı</label><input type="number" inputmode="numeric" step="1" id="meas_bodyage" value="' + pr.bodyAge + '"></div>' +
    '<button class="btn-primary" onclick="saveMeasurement()">Ölçümü Kaydet</button>' +
    '<div style="margin-top:14px;">' + renderMeasurementList() + '</div>' +
  '</div>';

  html += renderBlockStartCard();

  html += '<div class="card">' +
    '<div class="card-title">Program</div>' +
    '<div class="card-sub" style="margin-bottom:0;">Blok: ' + formatDateTR(state.blockStart) + ' – ' + formatDateTR(state.blockEnd) + '<br>Tamamlanan seans: ' + getCompletedCount() + ' · Hafta ' + getCurrentWeek() + '/24 · Faz ' + getPhase() + '</div>' +
  '</div>';

  html += '<div class="card">' +
    '<div class="card-title">Tehlikeli Bölge</div>' +
    '<div class="card-sub">Tüm seans geçmişi, su ve protein kayıtları silinir. Bu işlem geri alınamaz.</div>' +
    '<button class="btn-danger" onclick="resetAllData()">Verileri Sıfırla</button>' +
  '</div>';

  return html;
}

function saveSettings(){
  var weight = parseFloat(document.getElementById('set_weight').value);
  var height = parseFloat(document.getElementById('set_height').value);
  var bodyfat = parseFloat(document.getElementById('set_bodyfat').value);
  var bodyage = parseFloat(document.getElementById('set_bodyage').value);
  var proteinMult = parseFloat(document.getElementById('set_protein_mult').value);
  var waterGoal = parseInt(document.getElementById('set_water_goal').value, 10);

  if (!isNaN(weight) && weight > 0) state.profile.weightKg = weight;
  if (!isNaN(height) && height > 0) state.profile.heightCm = height;
  if (!isNaN(bodyfat) && bodyfat >= 0) state.profile.bodyFatPct = bodyfat;
  if (!isNaN(bodyage) && bodyage > 0) state.profile.bodyAge = bodyage;
  if (!isNaN(proteinMult) && proteinMult > 0) state.profile.proteinPerKg = proteinMult;
  if (!isNaN(waterGoal) && waterGoal > 0) state.profile.waterGoalBottles = waterGoal;

  saveState();
  render();
}

function downloadBackup(){
  var json = JSON.stringify(state, null, 2);
  var blob = new Blob([json], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'protokol-yedek-' + todayISO() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function triggerRestoreFilePicker(){
  var el = document.getElementById('restoreFileInput');
  if (el) el.click();
}

function restoreBackup(fileInput){
  var file = fileInput.files && fileInput.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    var parsed;
    try{
      parsed = JSON.parse(e.target.result);
    } catch(err){
      alert('Dosya okunamadı: geçerli bir JSON dosyası değil.');
      fileInput.value = '';
      return;
    }
    if (!parsed || typeof parsed !== 'object' || !parsed.profile || !Array.isArray(parsed.sessions)){
      alert('Bu dosya geçerli bir PROTOKOL yedeği gibi görünmüyor ("profile" / "sessions" alanları eksik).');
      fileInput.value = '';
      return;
    }
    if (!confirm('Bu işlem mevcut verilerinin üzerine yazacak, emin misin?')){
      fileInput.value = '';
      return;
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
    state = loadState();
    normalizeDaily();
    fileInput.value = '';
    render();
    alert('Yedek başarıyla geri yüklendi.');
  };
  reader.readAsText(file);
}

function resetAllData(){
  if (confirm('Tüm PROTOKOL verilerini (seanslar, su, protein, profil) silmek istediğinden emin misin?')){
    if (confirm('Bu işlem geri alınamaz. Onaylıyor musun?')){
      localStorage.removeItem(STORAGE_KEY);
      state = defaultState();
      saveState();
      activeTab = 'today';
      render();
    }
  }
}

/* ---------- Başlangıç ---------- */

function registerServiceWorker(){
  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register('service-worker.js').catch(function(){});
  }
}

function init(){
  state = loadState();
  normalizeDaily();
  render();
  registerServiceWorker();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
